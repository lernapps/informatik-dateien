# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: informatik/informatiksysteme
title:
  de: "Meine Dateien: ordnen, speichern, schützen"
  en: "My files: organise, store, protect"
intro:
  de: >-
    Mia ist 11 Jahre alt und geht in die Klasse 6b. Sie hat ein Tablet. Darauf liegen Fotos, Lieder und Texte für die
    Schule. Im ersten Kapitel hilfst du Mia, Ordnung zu machen: Du legst Dateien in Ordner, findest sie über ihren
    Pfad wieder und vergleichst Tablet, USB-Stick und Cloud. Im zweiten Kapitel, ein Jahr später, schützt du ihre
    Dateien: mit einer Sicherung, sicheren Passwörtern und Schutz vor Schadsoftware. Für die Klassen 5 bis 8.
  en: >-
    Mia is 11 and in class 6b. She has a tablet. On it there are photos, songs and texts for school. In the first
    chapter you help Mia tidy it up: you put files into folders, find them again by their path and compare the tablet,
    a USB stick and the cloud. In the second chapter, one year later, you protect her files: with a backup, secure
    passwords and protection against malware. For ages 10 to 14.
languages: [de, en]
# every exercise that draws tasks by number starts at task 1 (young learners)
tasks: { start: first }
chapters: [ordnen, schuetzen]
