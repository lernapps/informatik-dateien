# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Sichere Passwörter
  en: Secure passwords
description:
  de: "Warum ein langes Passwort schwer zu erraten ist: eine Simulation, die Regeln des BSI und wie du deine Zugänge schützt."
  en: "Why a long password is hard to guess: a simulation, the BSI's advice and how to protect your accounts."
competencies: [sicheres-passwort]
blocks:
  - type: section
    id: einstieg
    title:
      de: Jemand war in Selins Konto
      en: Someone was in Selin's account
    blocks:
      - type: text
        text:
          de: |
            **Selin:** Mia, jemand hat sich in mein Spiele-Konto eingeloggt! 😮
            **Mia:** Was war dein Passwort?
            **Selin:** selin2014. Mein Name und mein Geburtsjahr.
            **Mia:** Das kann jeder raten, der dich kennt. Und ein Computer rät noch viel schneller.

            Selin und Mia sind 12 und gehen in die 7b. Auf dieser Seite lernst du, warum manche Passwörter schnell
            erraten sind und andere fast nie, und wie du deine Zugänge schützt.
          en: |
            **Selin:** Mia, someone logged into my gaming account! 😮
            **Mia:** What was your password?
            **Selin:** selin2014. My name and the year I was born.
            **Mia:** Anyone who knows you can guess that. And a computer guesses even faster.

            Selin and Mia are 12 and in class 7b. On this page you will learn why some passwords are guessed quickly
            and others almost never, and how to protect your accounts.
      - type: number
        id: pin-moeglichkeiten
        text:
          de: Eine PIN hat 4 Ziffern, jede von 0 bis 9. Wie viele verschiedene PINs gibt es?
          en: A PIN has 4 digits, each from 0 to 9. How many different PINs are there?
        answer: 10000
        tolerance: 0
        mistakes:
          - answer: 40
            message:
              de: Du hast 10 · 4 gerechnet. Für jede Ziffer gibt es 10 Möglichkeiten, und jede kann mit jeder anderen zusammen vorkommen. Also 10 · 10 · 10 · 10.
              en: You worked out 10 · 4. Each digit has 10 options, and each can go with every other one. So 10 · 10 · 10 · 10.
          - answer: 9999
            message:
              de: Fast. Die PIN 0000 zählt auch mit. Von 0000 bis 9999 sind es eine mehr.
              en: Nearly. The PIN 0000 counts too. From 0000 to 9999 there is one more.
        explanation:
          de: 10 · 10 · 10 · 10 = 10 000 PINs, von 0000 bis 9999. Ein Computer probiert sie in einem Augenblick alle durch.
          en: 10 · 10 · 10 · 10 = 10 000 PINs, from 0000 to 9999. A computer tries them all in a moment.
  - type: section
    id: idee
    title:
      de: Wie viele Passwörter gibt es?
      en: How many passwords are there?
    blocks:
      - type: text
        text:
          de: |
            Ein Rateprogramm probiert alle Passwörter aus. Wie lange das dauert, hängt davon ab,
            wie viele es gibt. Das hängt von zwei Zahlen ab: wie viele Zeichen du zur Auswahl hast und wie lang das
            Passwort ist.
          en: |
            A guessing program tries all passwords. How long that takes depends on how many
            there are. That depends on two numbers: how many characters you can choose from and how long the
            password is.
      - type: definition
        term:
          de: Zeichenvorrat
          en: character set
        explanation:
          de: Alle Zeichen, aus denen ein Passwort bestehen darf, zum Beispiel 26 kleine Buchstaben oder 10 Ziffern.
          en: All the characters a password may be made of, for example 26 small letters or 10 digits.
      - type: formula
        formula: '\text{Anzahl} = \text{Zeichenvorrat}^{\,\text{Länge}}'
      - type: generated
        id: moeglichkeiten
        given:
          z: { pick: 1, from: { data: zeichenarten } }
          l: { int: [2, 4] }
        task:
          text:
            de: "Ein Passwort hat {{l}} Zeichen und besteht nur aus {{z.art}}. Wie viele verschiedene Passwörter gibt es?"
            en: "A password has {{l}} characters and is made only of {{z.art}}. How many different passwords are there?"
        answer:
          value: "pow(z.n, l)"
          compare: { number: { format: integer } }
        mistakes:
          - value: "z.n * l"
            message:
              de: "Du hast {{z.n}} · {{l}} gerechnet. Jedes Zeichen hat {{z.n}} Möglichkeiten, und sie kommen zusammen vor: Nimm {{z.n}} so oft mal sich selbst, wie das Passwort Zeichen hat."
              en: "You worked out {{z.n}} · {{l}}. Each character has {{z.n}} options, and they go together: multiply {{z.n}} by itself as many times as the password has characters."
          - value: "pow(l, z.n)"
            message:
              de: Du hast Länge und Zeichenvorrat vertauscht. Der Zeichenvorrat ist die Grundzahl, die Länge die Hochzahl.
              en: You swapped the length and the character set. The character set is the base, the length is the power.
        hint:
          de: "Wie bei der PIN: Zeichenvorrat hoch Länge."
          en: "Like the PIN: character set to the power of the length."
        steps:
          - de: "{{z.n}} hoch {{l}} = {{answer}}."
            en: "{{z.n}} to the power of {{l}} = {{answer}}."
  - type: section
    id: ausprobieren
    title:
      de: Ausprobieren, wie lange das Raten dauert
      en: Try out how long guessing takes
    blocks:
      - type: text
        text:
          de: |
            Stell mit dem Regler die Länge ein und hake die Zeichenarten an. Du tippst hier kein Passwort ein. Probier
            zuerst 12 statt 8 Zeichen. Dann zurück auf 8 und hake alle vier Zeichenarten an. Was bringt mehr?
          en: |
            Set the length with the slider and tick the kinds of characters. You do not type a password here. First
            try 12 instead of 8 characters. Then go back to 8 and tick all four kinds. Which helps more?
      - type: vue-component
        component: RateZeit
        props:
          lengthLabel: { de: Länge, en: Length }
          characters: { de: Zeichen, en: characters }
          kindsLabel: { de: Zeichenarten, en: Kinds of characters }
          kinds:
            - { name: { de: kleine Buchstaben, en: small letters }, size: 26 }
            - { name: { de: große Buchstaben, en: capital letters }, size: 26 }
            - { name: { de: Ziffern, en: digits }, size: 10 }
            - { name: { de: Sonderzeichen, en: special characters }, size: 33 }
          setLine: { de: "Zeichenvorrat: {n} Zeichen", en: "Character set: {n} characters" }
          countLine: { de: "Mögliche Passwörter: {anzahl}", en: "Possible passwords: {anzahl}" }
          timeLine: { de: "Ratezeit im Mittel: {zeit}", en: "Average time to guess: {zeit}" }
          none: { de: Hake mindestens eine Zeichenart an., en: Tick at least one kind of character. }
          rate: 10000000000
          units:
            - { one: { de: Sekunde, en: second }, many: { de: Sekunden, en: seconds }, seconds: 1 }
            - { one: { de: Minute, en: minute }, many: { de: Minuten, en: minutes }, seconds: 60 }
            - { one: { de: Stunde, en: hour }, many: { de: Stunden, en: hours }, seconds: 3600 }
            - { one: { de: Tag, en: day }, many: { de: Tage, en: days }, seconds: 86400 }
            - { one: { de: Jahr, en: year }, many: { de: Jahre, en: years }, seconds: 31536000 }
          bigs:
            - { name: { de: Tausend, en: thousand }, value: 1000 }
            - { name: { de: Millionen, en: million }, value: 1000000 }
            - { name: { de: Milliarden, en: billion }, value: 1000000000 }
            - { name: { de: Billionen, en: trillion }, value: 1000000000000 }
          less: { de: weniger als eine Sekunde, en: less than a second }
          hugeCount: { de: "eine Zahl mit {n} Stellen", en: "a number with {n} digits" }
          hugeTime:
            { de: "so viele Jahre, dass die Zahl {n} Stellen hat", en: "so many years that the number has {n} digits" }
          stages:
            - { de: Sekunden, en: seconds }
            - { de: Stunden, en: hours }
            - { de: Monate, en: months }
            - { de: Jahre, en: years }
            - { de: Jahrtausende, en: millennia }
          about: { de: ungefähr, en: about }
          locale: { de: de-DE, en: en-GB }
        nojs:
          de: >-
            Eine Simulation: Du wählst die Länge (4 bis 24 Zeichen) und die Zeichenarten, und sie zeigt, wie lange ein
            Rechner im Mittel zum Erraten braucht, wenn er 10 Milliarden Passwörter pro Sekunde probiert. Beispiele:
            8 kleine Buchstaben: ungefähr 10 Sekunden. 8 Zeichen aus allen vier Zeichenarten (95): ungefähr 4 Tage.
            12 kleine Buchstaben: ungefähr 55 Tage. 20 kleine Buchstaben: ungefähr 32 Milliarden Jahre.
          en: >-
            A simulation: you choose the length (4 to 24 characters) and the kinds of characters, and it shows how long
            a computer needs on average to guess, if it tries 10 billion passwords per second. Examples: 8 small
            letters: about 10 seconds. 8 characters from all four kinds (95): about 4 days. 12 small letters: about 55
            days. 20 small letters: about 32 billion years.
      - type: note
        title:
          de: Annahmen dieser App
          en: What this app assumes
        blocks:
          - type: text
            text:
              de: |
                Der Rechner probiert 10 Milliarden Passwörter pro Sekunde, und im Mittel findet er das richtige nach
                der Hälfte. Sonderzeichen zählen wir als 33. Das sind Annahmen, keine Messung. Echte Angreifer sind
                oft schneller: Sie probieren zuerst Namen, Wörter und Geburtsjahre, weil Menschen solche Passwörter
                wählen. Darum hilft „selin2014“ nichts.
              en: |
                The computer tries 10 billion passwords per second, and on average it finds the right one after half
                of them. We count special characters as 33. These are assumptions, not measurements. Real attackers
                are often faster: they try names, words and years of birth first, because people choose passwords
                like that. That is why “selin2014” does not help.
  - type: section
    id: zugang
    title:
      de: Deinen Zugang schützen
      en: Protecting your account
    blocks:
      - type: text
        text:
          de: |
            Das BSI, das Amt für Sicherheit in der Informationstechnik, rät: „Je länger, desto besser.“ Ein kurzes
            Passwort braucht mindestens 8 Zeichen aus vier Zeichenarten. Besser ist ein sehr langes, zum Beispiel aus
            mehreren Wörtern (das BSI nennt 20 bis 25 Zeichen). Und: Jedes Passwort nur für einen Zugang.
            [Mehr beim BSI](https://www.bsi.bund.de/dok/6596574)
          en: |
            The BSI, Germany's office for information security, advises: “The longer, the better.” A short password
            needs at least 8 characters from four kinds. A very long one is better, for example made of several words
            (the BSI says 20 to 25 characters). And: use each password for one account only.
            [More from the BSI (in German)](https://www.bsi.bund.de/dok/6596574)
      - type: definition
        term:
          de: Passwort-Manager
          en: password manager
        explanation:
          de: Ein Programm, das deine Passwörter verschlüsselt aufbewahrt. Du merkst dir nur noch ein langes Hauptpasswort.
          en: A program that keeps your passwords encrypted. You only need to remember one long main password.
      - type: definition
        term:
          de: Zwei-Faktor-Anmeldung
          en: two-factor login
        explanation:
          de: Du meldest dich mit zwei Dingen aus verschiedenen Arten an, zum Beispiel etwas, das du weißt (Passwort), und etwas, das du hast (Handy mit Code). Ist das Passwort verraten, ist das Konto noch geschützt.
          en: You log in with two things of different kinds, for example something you know (a password) and something you have (a phone with a code). If the password gets out, the account is still protected.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: single-choice
        id: am-schwersten
        text:
          de: Welches dieser Passwörter braucht ein Rateprogramm am längsten, wenn es alle Möglichkeiten durchprobiert?
          en: Which of these passwords takes a guessing program the longest if it tries all possibilities?
        options:
          - text:
              { de: "tomatefahrradwolkeregen (23 kleine Buchstaben)", en: "tomatobicyclecloudrain (22 small letters)" }
            correct: true
            info:
              de: 26 hoch 23 ist eine Zahl mit 33 Stellen. Die Länge macht es so stark, obwohl es nur kleine Buchstaben hat.
              en: 26 to the power of 22 is a number with 32 digits. The length makes it so strong, even though it only has small letters.
          - text: { de: "Hund!7 (6 Zeichen, vier Zeichenarten)", en: "Dog!7x (6 characters, four kinds)" }
            correct: false
            info:
              de: 95 hoch 6 sind ungefähr 740 Milliarden. Das schafft der Rechner in weniger als einer Minute.
              en: 95 to the power of 6 is about 740 billion. The computer gets through that in less than a minute.
          - text: { de: "selin2014 (9 Zeichen)", en: "selin2014 (9 characters)" }
            correct: false
            info:
              de: Ein Name und ein Geburtsjahr. Solche Passwörter probieren Angreifer zuerst.
              en: A name and a year of birth. Attackers try passwords like that first.
          - text: { de: "Abc12345 (8 Zeichen)", en: "Abc12345 (8 characters)" }
            correct: false
            info:
              de: Eine bekannte Reihe von Buchstaben und Ziffern. Auch die steht weit vorn auf den Ratelisten.
              en: A well-known row of letters and digits. That too is near the top of guessing lists.
        explanation:
          de: Jedes Zeichen mehr nimmt die Anzahl mal den Zeichenvorrat. Eine Zeichenart mehr vergrößert nur den Zeichenvorrat. Darum zählt die Länge am meisten.
          en: Each extra character multiplies the number by the character set. An extra kind only makes the character set bigger. That is why length counts most.
      - type: true-false
        id: ein-fuer-alles
        text:
          de: Wenn ein Passwort sehr stark ist, kannst du es für alle deine Zugänge nehmen.
          en: If a password is very strong, you can use it for all your accounts.
        answer: false
        explanation:
          de: Wird es bei einem Dienst verraten, sind sonst alle Zugänge offen. Das BSI rät, jedes Passwort nur für einen Zugang zu nehmen. Ein Passwort-Manager hilft beim Merken.
          en: If it gets out at one service, all your accounts are open. The BSI advises using each password for one account only. A password manager helps you remember them.
      - type: multiple-choice
        id: zusaetzlich-schuetzen
        text:
          de: Was schützt dein Konto zusätzlich zu einem guten Passwort? Wähle alles, was stimmt.
          en: What protects your account in addition to a good password? Choose everything that is true.
        options:
          - text: { de: Zwei-Faktor-Anmeldung einschalten, en: turning on two-factor login }
            correct: true
            info:
              de: Ja. Das BSI rät, sie zu nutzen, sobald ein Dienst sie anbietet.
              en: Yes. The BSI advises using it as soon as a service offers it.
          - text: { de: einen Passwort-Manager nutzen, en: using a password manager }
            correct: true
            info:
              de: Ja. Dann kannst du für jeden Zugang ein eigenes, langes Passwort haben.
              en: Yes. Then you can have a separate long password for each account.
          - text:
              de: "das Passwort der besten Freundin schicken, damit es nicht verloren geht"
              en: "sending the password to your best friend so it does not get lost"
            correct: false
            info:
              de: Ein Passwort, das ein anderer kennt, ist nicht mehr geheim, auch wenn ihr euch vertraut.
              en: A password that someone else knows is no longer secret, even if you trust each other.
          - text:
              { de: das Passwort auf einen Zettel am Tablet kleben, en: sticking the password on a note on the tablet }
            correct: false
            info:
              de: Dann kann es jeder lesen, der das Tablet in die Hand nimmt.
              en: Then anyone who picks up the tablet can read it.
        explanation:
          de: Zwei-Faktor-Anmeldung und ein Passwort-Manager schützen dich zusätzlich. Ein geteiltes oder aufgeklebtes Passwort schützt nicht.
          en: Two-factor login and a password manager give you extra protection. A shared password or one on a note does not.
      - type: text
        text:
          de: |
            **Selin:** Neues Passwort: lang, nur für dieses Konto, und Zwei-Faktor ist an. 💪
            **Mia:** Gut! Aber kann man auch ohne Passwort in ein Gerät? Auf der nächsten Seite, „Schadsoftware“, geht
            es darum, wie Schadprogramme hineinkommen.
          en: |
            **Selin:** New password: long, only for this account, and two-factor is on. 💪
            **Mia:** Great! But can someone get into a device without a password? On the next page, “Malware”, you
            will find out how harmful programs get in.
