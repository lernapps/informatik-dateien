# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Ordner und Dateien
  en: Files and folders
description:
  de: "Mias Tablet aufräumen: Dateien in Ordner legen und wiederfinden. Der Ordnerbaum und ein Dateimanager."
  en: "Tidying Mia's tablet: putting files into folders and finding them again. The folder tree and a file manager."
competencies: [ordner-und-dateien]
blocks:
  - type: section
    id: einstieg
    title:
      de: Wo ist Mias Referat?
      en: Where is Mia's talk?
    blocks:
      - type: figure
        image: images/mia-sucht.svg
        alt:
          de: "Mia mit Brille und lila Jacke schaut ratlos auf ihr Tablet mit türkiser Hülle. Auf dem Bildschirm liegen viele kleine Zeichen für Texte, Fotos und Lieder durcheinander."
          en: "Mia, with glasses and a purple jacket, looks puzzled at her tablet with a turquoise case. On the screen, lots of small symbols for texts, photos and songs lie all over the place."
        caption:
          de: Mias Tablet. Alles liegt durcheinander.
          en: Mia's tablet. Everything is mixed up.
        source:
          de: eigene Zeichnung, Mia aus lernapps/informatik-computer
          en: own drawing, Mia from lernapps/informatik-computer
        licence: CC-BY-4.0
      - type: text
        text:
          de: |
            Mia hat gestern ihr Referat für Deutsch geschrieben und gespeichert. Heute findet sie es nicht. Auf ihrem
            Tablet liegen 40 Dateien: Fotos, Lieder, Texte.

            Auf dieser Seite lernst du, wie du Dateien so ablegst, dass du sie wiederfindest. Dafür brauchst du den
            Baum, den du schon kennst.
          en: |
            Yesterday Mia wrote her talk for German and saved it. Today she cannot find it. There are 40 files on her
            tablet: photos, songs, texts.

            On this page you will learn how to store files so that you can find them again. For this you need the
            tree that you already know.
      - type: single-choice
        id: was-hilft
        text:
          de: Was hilft Mia am meisten, ihr Referat jetzt und später wiederzufinden?
          en: What helps Mia most to find her talk now and later?
        options:
          - text:
              de: Sie legt ihre Dateien nach ihrer Art in Ordner, zum Beispiel einen Ordner für die Schule.
              en: She puts her files into folders by their kind, for example a folder for school.
            correct: true
            info:
              de: Dann weiß sie, wo sie suchen muss, auch in einem Jahr noch.
              en: Then she knows where to look, even a year from now.
          - text:
              de: Sie schaut unter „Zuletzt verwendet“ nach.
              en: She looks under “Recent”.
            correct: false
            info:
              de: Das hilft nur heute. „Zuletzt verwendet“ ist eine Liste der letzten Dateien, kein Ort. Die Datei liegt woanders, und nächste Woche ist sie aus der Liste verschwunden.
              en: That only helps today. “Recent” is a list of the last files, not a place. The file is stored somewhere else, and next week it will be gone from the list.
          - text:
              de: Sie speichert das Referat noch einmal, dann ist es sicher da.
              en: She saves the talk again, then it is sure to be there.
            correct: false
            info:
              de: Gespeichert ist es schon. Die Frage ist, wo. Oft landet eine Datei im Ordner „Downloads“.
              en: It is already saved. The question is where. A file often ends up in the folder “Downloads”.
        explanation:
          de: Ordner geben jeder Datei einen festen Platz. Was einen Platz hat, findest du wieder.
          en: Folders give every file a fixed place. If something has a place, you can find it again.
  - type: section
    id: idee
    title:
      de: Mias Ordnerbaum
      en: Mia's folder tree
    blocks:
      - type: text
        text:
          de: |
            Mia räumt auf. Danach sieht ihr Tablet so aus wie ein Baum aus der Informatik: oben die **Wurzel**, das
            ist das Tablet selbst. Darunter die **Ordner**, das sind Knoten. Ganz unten die **Dateien**, das sind die
            Blätter mit gestricheltem Rand.
          en: |
            Mia tidies up. After that, her tablet looks like a tree in computer science: at the top is the **root**,
            which is the tablet itself. Below it are the **folders**, which are nodes. At the very bottom are the
            **files**, which are the leaves with a dashed border.
      - type: definition
        term:
          de: Datei
          en: file
        explanation:
          de: Eine Datei ist ein gespeichertes Stück Daten mit einem Namen, zum Beispiel ein Foto, ein Lied oder ein Text.
          en: A file is a stored piece of data with a name, for example a photo, a song or a text.
      - type: definition
        term:
          de: Ordner
          en: folder
        explanation:
          de: Ein Ordner ist ein Platz für Dateien und für weitere Ordner. Er hat auch einen Namen.
          en: A folder is a place for files and for more folders. It has a name too.
      - type: vue-component
        component: Ordnerbaum
        props:
          nodes: { data: mias-tablet }
          stand: 1
        nojs:
          de: >-
            Mias Ordnerbaum. Oben die Wurzel „Mias Tablet“. Darunter drei Ordner: Schule, Fotos und Musik. Im Ordner
            Schule liegt referat.txt. Im Ordner Fotos liegen see.jpg und party.jpg. Im Ordner Musik liegt lied.mp3.
            Die Dateien ganz unten haben einen gestrichelten Rand.
          en: >-
            Mia's folder tree. At the top is the root “Mia's tablet”. Below it are three folders: School, Photos and
            Music. In the folder School there is talk.txt. In the folder Photos there are lake.jpg and party.jpg. In
            the folder Music there is song.mp3. The files at the very bottom have a dashed border.
      - type: definition
        term:
          de: Dateiendung
          en: file extension
        explanation:
          de: Die Endung steht am Ende des Dateinamens nach dem Punkt. Sie zeigt die Art der Datei, zum Beispiel .jpg für ein Foto, .mp3 für etwas zum Hören, .txt für einen Text.
          en: The extension comes at the end of the file name, after the dot. It shows the kind of file, for example .jpg for a photo, .mp3 for something to listen to, .txt for a text.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |
                Ein Ordner kann Dateien und Ordner enthalten. Eine Datei enthält keinen Ordner, sie ist ein Blatt.
                Wer einen Ordner löscht, löscht **alles darin** mit. Und ein neuer Name macht aus einem Foto kein
                anderes Foto: Der Inhalt bleibt gleich.
              en: |
                A folder can hold files and folders. A file holds no folder, it is a leaf. If you delete a folder,
                you also delete **everything in it**. And a new name does not turn a photo into a different photo:
                what is in it stays the same.
  - type: section
    id: ausprobieren
    title:
      de: Im Dateimanager aufräumen
      en: Tidying up in the file manager
    blocks:
      - type: text
        text:
          de: |
            Auf dem Tablet siehst du den Baum nie ganz. Ein **Dateimanager** zeigt immer nur einen Ordner. So
            bedienst du ihn:

            - Tippe auf einen Ordner, dann öffnet er sich. Oben steht, wo du gerade bist.
            - „Nach oben“ bringt dich einen Ordner zurück.
            - „Ausschneiden“ nimmt eine Datei weg. Öffne dann den Ordner, in den sie soll, und tippe auf
              „Einfügen“. Ausschneiden und Einfügen heißt zusammen: **verschieben**.

            Neue Dateien landen oft im Ordner „Downloads“. Hol die neue Datei dort heraus und lege sie in einen
            passenden Ordner. Drück dann „Prüfen“.
          en: |
            On the tablet you never see the whole tree. A **file manager** only ever shows one folder. This is how
            you use it:

            - Tap a folder and it opens. At the top it says where you are.
            - “Up” takes you back one folder.
            - “Cut” takes a file away. Then open the folder where it should go and tap “Paste”. Cut and paste
              together mean: **move**.

            New files often end up in the folder “Downloads”. Take the new file out of there and put it into a
            folder that fits. Then press “Check”.
      - type: vue-component
        id: ablegen
        component: Dateimanager
        props:
          mode: ablegen
          nodes: { data: mias-tablet }
          stand: 1
          ablagen: { data: ablegen }
          oeffnen: []
          task:
            de: "Neu in Downloads: {datei}. Lege die Datei in einen passenden Ordner."
            en: "New in Downloads: {datei}. Put the file into a folder that fits."
          here: { de: "Du bist hier:", en: "You are here:" }
          up: { de: Nach oben, en: Up }
          cut: { de: Ausschneiden, en: Cut }
          paste: { de: "{datei} einfügen", en: "Paste {datei}" }
          open: { de: Öffnen, en: Open }
          opened: { de: "Offen: {pfad}", en: "Open: {pfad}" }
          empty: { de: Dieser Ordner ist leer., en: This folder is empty. }
          folder: { de: "Ordner", en: "folder" }
          file: { de: "Datei", en: "file" }
          notMoved:
            de: Die Datei liegt noch in Downloads. Öffne Downloads und schneide sie aus.
            en: The file is still in Downloads. Open Downloads and cut it.
          notPasted:
            de: Du hast die Datei ausgeschnitten, aber noch nirgends eingefügt. Öffne einen Ordner und tippe auf „einfügen“.
            en: You cut the file, but you have not pasted it anywhere yet. Open a folder and tap “Paste”.
          wrongFolder:
            de: "Die Datei liegt jetzt in {ordner}. {art} Passt sie dorthin?"
            en: "The file is now in {ordner}. {art} Does it belong there?"
          sameName: { de: "", en: "" }
          otherFile: { de: "", en: "" }
        examples:
          accepted:
            - { answer: 4, seed: 1 }
          rejected:
            - { answer: 2, seed: 1 }
            - { answer: -1, seed: 1 }
            - { answer: 5, seed: 1 }
      - type: note
        title:
          de: Zum Mitmachen ohne Tablet
          en: Try it without a tablet
        blocks:
          - type: text
            text:
              de: |
                Dein Schulranzen ist auch ein Baum. Zeichne ihn auf: oben der Ranzen als Wurzel, darunter die Mappen
                und Fächer als Ordner, unten die Hefte und Blätter. Wo liegt dein Hausaufgabenheft? Findet deine
                Nachbarin es mit deinem Baum in zehn Sekunden?
              en: |
                Your school bag is a tree too. Draw it: at the top the bag as the root, below it the folders and
                pockets as folders, at the bottom the exercise books and sheets. Where is your homework book? Can the
                person next to you find it in ten seconds with your tree?
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: generated
        id: wiederfinden
        given:
          s: { pick: 1, from: { data: suchen } }
        task:
          text:
            de: "Mias Tablet ist aufgeräumt wie im Ordnerbaum oben. Mia sucht {{s.was}}. In welchem Ordner schaut sie nach?"
            en: "Mia's tablet is tidy, like in the folder tree above. Mia is looking for {{s.was}}. Which folder does she look in?"
        answer:
          value: s.ordner
          compare:
            choice:
              - { de: Schule, en: School }
              - { de: Fotos, en: Photos }
              - { de: Musik, en: Music }
        mistakes:
          - value: s.falsch1
            message: { de: "{{s.grund1}}", en: "{{s.grund1}}" }
          - value: s.falsch2
            message: { de: "{{s.grund2}}", en: "{{s.grund2}}" }
        hint:
          de: Was ist es für eine Art von Datei? Ein Text für die Schule, ein Foto oder etwas zum Hören?
          en: What kind of file is it? A text for school, a photo or something to listen to?
        steps:
          - de: "Mia sucht {{s.was}}. Das gehört in den Ordner {{answer}}."
            en: "Mia is looking for {{s.was}}. That belongs in the folder {{answer}}."
      - type: number
        id: ordner-loeschen
        text:
          de: Mia löscht im Ordnerbaum oben den Ordner Fotos. Wie viele Dateien sind dann weg?
          en: In the folder tree above, Mia deletes the folder Photos. How many files are gone then?
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 0
            message:
              de: Wer einen Ordner löscht, löscht alles darin mit. Zähle die Dateien unter Fotos.
              en: If you delete a folder, you also delete everything in it. Count the files below Photos.
          - answer: 1
            message:
              de: Zähle alle Blätter unter dem Ordner Fotos, nicht nur eins.
              en: Count all the leaves below the folder Photos, not just one.
          - answer: 4
            message:
              de: Das sind alle Dateien auf dem Tablet. Weg sind nur die im Ordner Fotos.
              en: Those are all the files on the tablet. Only the ones in the folder Photos are gone.
        explanation:
          de: Im Ordner Fotos liegen zwei Dateien, see.jpg und party.jpg. Mit dem Ordner sind beide weg.
          en: In the folder Photos there are two files, lake.jpg and party.jpg. Both are gone with the folder.
      - type: true-false
        id: umbenennen
        text:
          de: Mia nennt see.jpg um in ausflug.jpg. Jetzt zeigt die Datei ein anderes Bild.
          en: Mia renames lake.jpg to trip.jpg. Now the file shows a different picture.
        answer: false
        explanation:
          de: Der Name ist wie ein Schild an der Datei. Ein neues Schild ändert nicht, was in der Datei ist. Die Endung .jpg bleibt, es ist dasselbe Foto.
          en: The name is like a label on the file. A new label does not change what is in the file. The extension .jpg stays, it is the same photo.
      - type: multiple-choice
        id: im-ordner
        text:
          de: Was kann in einem Ordner liegen? Wähle alles, was stimmt.
          en: What can be inside a folder? Choose everything that is true.
        options:
          - text: { de: eine Datei, en: a file }
            correct: true
            info:
              de: Ja, dafür sind Ordner da.
              en: Yes, that is what folders are for.
          - text: { de: ein anderer Ordner, en: another folder }
            correct: true
            info:
              de: Ja, zum Beispiel ein Ordner Deutsch im Ordner Schule. Im Baum hängt dann ein Knoten unter einem Knoten.
              en: Yes, for example a folder German inside the folder School. In the tree, one node then hangs below another node.
          - text: { de: das ganze Tablet, en: the whole tablet }
            correct: false
            info:
              de: Das Tablet ist die Wurzel. Alle Ordner liegen darin, nicht umgekehrt.
              en: The tablet is the root. All folders are inside it, not the other way round.
          - text: { de: die Wurzel des Baums, en: the root of the tree }
            correct: false
            info:
              de: Die Wurzel steht ganz oben. Sie hängt in keinem Ordner.
              en: The root is at the very top. It is not inside any folder.
        explanation:
          de: Ein Ordner kann Dateien und weitere Ordner enthalten. Das Tablet selbst ist die Wurzel über allem.
          en: A folder can hold files and more folders. The tablet itself is the root above everything.
      - type: text
        text:
          de: |
            Mias Tablet ist aufgeräumt. Jede Datei hat ihren Ordner. Da schreibt Selin: „Schick mir das Foto vom See!“
            Auf der nächsten Seite beschreibt Mia genau, wo es liegt.
          en: |
            Mia's tablet is tidy. Every file has its folder. Then Selin writes: “Send me the photo of the lake!” On
            the next page Mia describes exactly where it is.
