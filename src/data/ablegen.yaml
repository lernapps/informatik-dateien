# Tasks of the file manager in the mode `ablegen` (page ordner-und-dateien): a new file lies in Downloads; the learner
# cuts it and pastes it into a fitting folder. `ordner`: the ids (numbers) of mias-tablet where it fits (stand 1). `art`: what
# its ending says it is; the message for a wrong folder uses it, never the folder.
- {
    datei: { de: gedicht.txt, en: poem.txt },
    ordner: [3],
    art:
      {
        de: "Die Endung .txt zeigt: Das ist ein Text. Es ist ein Gedicht für den Unterricht.",
        en: "The extension .txt shows that this is a text. It is a poem for a lesson.",
      },
  }
- {
    datei: { de: vokabeln.txt, en: words.txt },
    ordner: [3],
    art:
      {
        de: "Die Endung .txt zeigt: Das ist ein Text. Darin stehen Vokabeln für den Unterricht.",
        en: "The extension .txt shows that this is a text. It has words to learn for a lesson.",
      },
  }
